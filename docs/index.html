<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Developer Handbook — Production Systems & Architectures</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Curated architectural patterns, cheat sheets, and systems engineering guides spanning Linux internals, distributed consensus, compilers, and zero-knowledge cryptography.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    @font-face {
      font-family: 'Medeo Sans';
      src: url('fonts/MedeoSansVariable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Medeo Mono';
      src: url('fonts/MedeoMonoVariable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --base-font-size: 15px;
      --theme-color: #58a6ff;
    }

    body, .sidebar, .sidebar-nav {
      font-family: 'Medeo Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }

    h1, h2, h3, h4, .app-name, .sidebar-nav strong {
      font-family: 'Medeo Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-optical-sizing: auto;
    }

    code, pre, .code, .token {
      font-family: 'Medeo Mono', SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace !important;
    }

    .markdown-section {
      max-width: 950px;
      padding: 30px 40px;
    }
    .sidebar {
      background-color: #0d1117;
      border-right: 1px solid #30363d;
    }
    .content {
      background-color: #0d1117;
    }
    .sidebar-nav li strong {
      color: #58a6ff;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: inline-block;
      margin-top: 14px;
    }
    .sidebar-nav li a {
      color: #c9d1d9;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .sidebar-nav li.active > a {
      color: #58a6ff !important;
      font-weight: 600;
    }
    .mermaid {
      background-color: #161b22;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body>
  <div id="app">Loading Developer Handbook...</div>
  <script src="//cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script>
    var num = 0;
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    window.$docsify = {
      name: 'Developer Handbook 📘',
      repo: 'isihussain/developer-handbook',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search 715+ technical guides...',
        noData: 'No matching technical documents found.',
        depth: 3
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
</body>
</html>
