<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Developer Handbook — Production Systems & Cryptography Reference</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Curated architectural patterns, cheat sheets, and systems engineering guides spanning Linux internals, distributed consensus, compilers, and zero-knowledge cryptography.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #3b82f6;
    }
    .markdown-section {
      max-width: 900px;
    }
    .sidebar {
      background-color: #0d1117;
      border-right: 1px solid #30363d;
    }
    .content {
      background-color: #0d1117;
    }
    .sidebar-nav li strong {
      color: #58a6ff;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .mermaid {
      background-color: #161b22;
      padding: 16px;
      border-radius: 6px;
      margin: 16px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">Loading technical handbook...</div>
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script>
    var num = 0;
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    window.$docsify = {
      name: 'Developer Handbook',
      repo: 'isihussain/developer-handbook',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'linux-kernel-architecture.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search 232+ technical guides...',
        noData: 'No matching technical documents found.',
        depth: 3
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              return (
                '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + "</div>"
              );
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
</body>
</html>
